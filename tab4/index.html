<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela Empresarial</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Tabela Empresarial</h2>
  
  <table>
    <thead>
      <tr>
        <th rowspan="2">Nome</th>
        <th rowspan="2">Cargos</th>
        <th colspan="2">Departamento</th>
      </tr>
      <tr>
        <th>Principal</th>
        <th>Divisão</th>
      </tr>
    </thead>
    <tbody>
      <!-- Bloco Ana Silva -->
      <tr>
        <td rowspan="3" class="categoria">Ana Silva</td>
        <td>Diretora Executiva</td>
        <td>Administração</td>
        <td>Presidência</td>
      </tr>
      <tr>
        <td>Coordenadora de Projetos</td>
        <td>Operações</td>
        <td>Inovação</td>
      </tr>
      <tr>
        <td>Consultora Técnica</td>
        <td>Tecnologia</td>
        <td>Sistemas</td>
      </tr>

      <!-- Bloco Carlos Souza -->
      <tr>
        <td rowspan="2" class="categoria">Carlos Souza</td>
        <td>Gerente de Vendas</td>
        <td>Comercial</td>
        <td>Expansão</td>
      </tr>
      <tr>
        <td>Analista de Contas</td>
        <td>Financeiro</td>
        <td>Faturamento</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
